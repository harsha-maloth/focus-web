name: Android APK

# Builds a debug APK in the cloud so no Android Studio is needed.
# Download it from the run page: Actions > this run > Artifacts > focus-debug-apk.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Optional: keep the same debug signing key between builds, so a new APK installs over the
      # old one. Without the secret each build is signed with a throwaway key and the old app
      # must be uninstalled first. See android/README.md for how to create the secret.
      - name: Use the stored debug key, if there is one
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Using the stored debug key."
          else
            echo "No stored key: this APK uses a throwaway key. Uninstall the old build before installing it."
          fi

      # No Gradle wrapper in the repo yet, so install Gradle through the setup action.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - run: gradle --no-daemon testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: focus-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
