name: Docs check

# Reminder only: it never fails the build and never blocks the deploy.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Warn if code changed without a log entry
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          changed=$(git diff --name-only "$base" HEAD 2>/dev/null || true)
          echo "$changed"
          if echo "$changed" | grep -qE '^(web/|supabase/|\.github/workflows/)'; then
            if ! echo "$changed" | grep -qE '^(CHANGELOG\.md|docs/ai-log\.md)$'; then
              echo "::warning::Code, migrations or workflows changed but CHANGELOG.md and docs/ai-log.md did not. See AGENTS.md."
            fi
          fi
